name: Migration

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download latest warehouse artifact
        uses: dawidd6/action-download-artifact@v9
        with:
          name: warehouse-latest
          workflow: daily-pipeline.yml

      - name: Restore warehouse.db
        run: |
          mkdir -p data

          if [ -f "latest.db" ]; then
            mv latest.db data/warehouse.db
          elif [ -f "artifacts/warehouse/latest.db" ]; then
            cp artifacts/warehouse/latest.db data/warehouse.db
          else
            echo "latest.db not found"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Install local modules
        run: uv pip install -e .

      - name: Run migration
        run: uv run python migration/migration.py

      - name: Upload migrated warehouse
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-latest
          path: data/warehouse.db
          retention-days: 90
          overwrite: true

      - name: Upload backup snapshot
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-migrated-${{ github.run_id }}
          path: data/warehouse.db
          retention-days: 90
