name: Daily Pipeline

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      YT_DATA_API: ${{ secrets.YT_DATA_API }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Install local modules
        run: uv pip install -e .

      - name: Run daily pipeline
        run: uv run python main.py daily

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-${{ github.run_id }}
          path: artifacts/warehouse/
          retention-days: 90

      - name: Upload latest artifact (for local restore fallback)
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-latest
          path: artifacts/warehouse/latest.db
          retention-days: 90
          overwrite: true
